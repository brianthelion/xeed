[xeed.tools.pandoc]

[xeed.tools.pandoc.vars]
IMAGE: {xeed.vars.PROJECT}-pandoc:{xeed.vars.HASH}
DEFAULTS_PATH: {xeed.vars.env.PWD}/pub/docs/pandoc-defaults.yaml
DOCKERFILE_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/pandoc.df
BUILD_SCRIPT_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/pandoc-build.sh

[xeed.tools.pandoc.cmds.pandoc/check]
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker image inspect {xeed.tools.pandoc.vars.IMAGE} > /dev/null 2>&1

[xeed.tools.pandoc.cmds.pandoc/build]
description: build the pandoc Docker image (debian:slim + pandoc + texlive-xetex)
skip_on: xeed.tools.pandoc.cmds.pandoc/check
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.build
DOCKERFILE_PATH: {xeed.tools.pandoc.vars.DOCKERFILE_PATH}
IMAGE_TAG: {xeed.tools.pandoc.vars.IMAGE}

[xeed.tools.pandoc.cmds.pandoc/docs]
description: generate PDFs from all docs/*.md into pub/docs/
depends_on: xeed.tools.pandoc.cmds.pandoc/build
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker run --rm \
  --user $(id -u):$(id -g) \
  -v {xeed.vars.env.PWD}:{xeed.vars.env.PWD} \
  -w {xeed.vars.env.PWD} \
  --entrypoint bash \
  {xeed.tools.pandoc.vars.IMAGE} \
  {xeed.tools.pandoc.vars.BUILD_SCRIPT_PATH}

[xeed.tools.pandoc.cmds.pandoc/doc]
description: run pandoc inside the project tree — paths are relative to the project root (e.g. xeed pandoc/doc docs/darq4_litepaper.md -o pub/docs/darq4_litepaper.pdf)
depends_on: xeed.tools.pandoc.cmds.pandoc/build
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker run --rm \
  --user $(id -u):$(id -g) \
  -v {xeed.vars.env.PWD}:{xeed.vars.env.PWD} \
  -w {xeed.vars.env.PWD} \
  --entrypoint pandoc \
  {xeed.tools.pandoc.vars.IMAGE} \
  --defaults {xeed.tools.pandoc.vars.DEFAULTS_PATH} \
  {xeed.vars.cli.EXTRA_ARGS}

[xeed.tools.pandoc.files.dockerfile]
path: {xeed.tools.pandoc.vars.DOCKERFILE_PATH}
contents:
  FROM debian:stable-slim
  RUN apt-get update && apt-get install -y --no-install-recommends \
      pandoc \
      texlive-xetex \
      texlive-fonts-recommended \
      texlive-plain-generic \
      lmodern \
      && rm -rf /var/lib/apt/lists/*

[xeed.tools.pandoc.files.build_script]
path: {xeed.tools.pandoc.vars.BUILD_SCRIPT_PATH}
contents:
  #!/usr/bin/env bash
  set -euo pipefail
  for f in {xeed.vars.env.PWD}/docs/*.md ; do
    base=$(basename "$f" .md)
    echo "  -> ${{base}}.pdf"
    pandoc "$f" --defaults "{xeed.vars.env.PWD}/pub/docs/pandoc-defaults.yaml" -o "{xeed.vars.env.PWD}/pub/docs/${{base}}.pdf"
  done
  echo "Done."
