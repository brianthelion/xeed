# compose — general-purpose docker compose stack runner.
#
# Materializes a helper (compose_run.sh) via xeed's file mechanism and drives the
# common up/wait/faildetect/log-dump/teardown dance for the project's compose-based
# test/demo stacks.  Per-stack tasks call {xeed.tools.compose.vars.SCRIPT} with
# --project/--wait/-f (see e.g. project/socket/python/breakglass_gated_demo).
#
# Tool name is `compose` (not `docker-compose`): xeed tool names are [\w]+.

[xeed.tools.compose]

[xeed.tools.compose.vars]
SCRIPT: {xeed.vars.env.PWD}/{xeed.vars.CACHE_DIR}/compose_run.sh
LOGS_DIR: {xeed.vars.env.PWD}/{xeed.vars.CACHE_DIR}/logs

# Fetch the last dumped logs for a stack.  Usage: xeed compose/logs <project>
[xeed.tools.compose.cmds.compose/logs]
description: print a stack's last dumped logs — usage: xeed compose/logs <project> [service...]
type: xeed.types.tool.subtypes.clitool
cmdstr: set -- {xeed.vars.cli.EXTRA_ARGS} ; PROJ="$1" ; [ $# -gt 0 ] && shift ; \
  LOG="{xeed.tools.compose.vars.LOGS_DIR}/$PROJ.log" ; \
  if [ -z "$PROJ" ] || [ ! -f "$LOG" ] ; then \
    echo "usage: xeed compose/logs <project> [service...]" ; \
    echo "stacks: $(ls -1 {xeed.tools.compose.vars.LOGS_DIR} 2>/dev/null | sed 's/\.log$//' | xargs)" ; \
  elif [ $# -eq 0 ] ; then \
    cat "$LOG" ; \
  else \
    grep -E "^($(echo "$@" | tr ' ' '|'))-[0-9]" "$LOG" ; \
  fi

# The helper script (materialized to CACHE_DIR before any command runs).
[xeed.tools.compose.files.compose_run]
path: {xeed.tools.compose.vars.SCRIPT}
contents:
  #!/usr/bin/env bash
  # Materialized by xeed from xeed.d/compose.cfg — do not edit in the cache.
  # up -d --remove-orphans -> wait a service -> ALWAYS dump every service's logs to
  # .xeedcache/logs/<project>.log -> ALWAYS tear down (down -v). On failure it names
  # the containers that exited non-zero and prints the compose/logs command for them
  # (read from the dumped file — no need to keep the stack up).
  # Extra: --then-run SERVICE (one-off after the wait passes), --down (teardown only),
  # --keep (dump logs but DO NOT tear down on success — for stay-up interactive stacks).
  # All docker goes through xeed's DinD wrapper, passed via --xeed "<xeed cmd>".
  LOGS_DIR="{xeed.tools.compose.vars.LOGS_DIR}"
  XEED=""; PROJECT=""; ENV_FILE=""; WAIT_SVC=""; THEN_RUN=""; DOWN_ONLY=0; KEEP=0; FILE_ARGS=""; UP_ARGS=""
  while [ $# -gt 0 ]; do
    case "$1" in
      --xeed)     XEED="$2"; shift 2 ;;
      --project)  PROJECT="$2"; shift 2 ;;
      --env-file) ENV_FILE="$2"; shift 2 ;;
      --wait)     WAIT_SVC="$2"; shift 2 ;;
      --then-run) THEN_RUN="$2"; shift 2 ;;
      --up-args)  UP_ARGS="$2"; shift 2 ;;
      --down)     DOWN_ONLY=1; shift ;;
      --keep)     KEEP=1; shift ;;
      -f)         FILE_ARGS="$FILE_ARGS -f $2"; shift 2 ;;
      *) echo "compose_run: unknown arg: $1" >&2; exit 2 ;;
    esac
  done
  if [ -z "$XEED" ] || [ -z "$PROJECT" ] || [ -z "$FILE_ARGS" ]; then
    echo "compose_run: --xeed, --project and at least one -f are required" >&2; exit 2
  fi
  ENV_ARGS=""; [ -n "$ENV_FILE" ] && ENV_ARGS="--env-file $ENV_FILE"
  # Intentional word-splitting: $XEED may be multi-word; the rest are flags/paths.
  COMPOSE="$XEED docker compose --project-name $PROJECT $FILE_ARGS $ENV_ARGS"
  LOGFILE="$LOGS_DIR/$PROJECT.log"
  mkdir -p "$LOGS_DIR"
  if [ "$DOWN_ONLY" -eq 1 ]; then $COMPOSE down -v; exit $?; fi
  if ! $COMPOSE up -d --remove-orphans $UP_ARGS; then
    $COMPOSE logs --no-color --timestamps > "$LOGFILE" 2>&1 || true
    echo "compose_run: 'up' failed — logs: $LOGFILE" >&2; exit 1
  fi
  EXIT=0
  if [ -n "$WAIT_SVC" ]; then $COMPOSE wait "$WAIT_SVC"; EXIT=$?; fi
  if [ "$EXIT" -eq 0 ] && [ -n "$THEN_RUN" ]; then
    echo "--- $WAIT_SVC passed; one-off: $THEN_RUN ---"; $COMPOSE run --rm "$THEN_RUN"; EXIT=$?
  fi
  $COMPOSE logs --no-color --timestamps > "$LOGFILE" 2>&1 || true
  echo "=== full logs: $LOGFILE ==="
  if [ "$EXIT" -ne 0 ]; then
    FAILED=$($COMPOSE ps --all --format json 2>/dev/null | python3 -c "import sys,json;d=sys.stdin.read();objs=json.loads(d.strip())if d.strip().startswith('[')else[json.loads(l)for l in d.splitlines()if l.lstrip().startswith(chr(123))];[print(o['Service'])for o in objs if o.get('ExitCode',0)]" | xargs)
    echo "--- FAILED (exit $EXIT). Full log dumped: $LOGFILE ---"
    if [ -n "$FAILED" ]; then
      echo "--- containers with errors: $FAILED"
      echo "--- their logs:  $XEED compose/logs $PROJECT $FAILED"
    else
      echo "--- logs:  $XEED compose/logs $PROJECT"
    fi
  fi
  if [ "$KEEP" -eq 1 ] && [ "$EXIT" -eq 0 ]; then
    echo "=== stack kept up (--keep) — stop it with the matching *_down task ==="
    exit 0
  fi
  $COMPOSE down -v
  exit "$EXIT"
