[xeed.tools.terraform]

[xeed.tools.terraform.vars]
TERRAFORM_VERSION: 1.9.3
# Tag by terraform version, NOT config hash. A hash tag differs between the host
# and the (nested) deploy container — different env/hostname/cwd — so the
# host-built image would be invisible to nested `./xeed terraform`, forcing a
# rebuild on every call. A stable version tag lets the one start-of-deploy build
# be reused everywhere. Caveat: if you edit THIS Dockerfile without bumping
# TERRAFORM_VERSION, force a refresh with `docker rmi {xeed.vars.PROJECT}-terraform:{xeed.tools.terraform.vars.TERRAFORM_VERSION}`.
IMAGE_TAG: {xeed.vars.PROJECT}-terraform:{xeed.tools.terraform.vars.TERRAFORM_VERSION}
DOCKERFILE_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/xeed-terraform.df

# ---------------------------------------------------------------------------
# Image (locally built → runs as host {USER} via the Dockerfile USER directive)
# ---------------------------------------------------------------------------

[xeed.tools.terraform.cmds.terraform/check]
type: xeed.types.tool.subtypes.clitool
cmdstr: docker image inspect {xeed.tools.terraform.vars.IMAGE_TAG} > /dev/null 2>&1

[xeed.tools.terraform.cmds.terraform/build]
description: build the xeed terraform Docker image (skips if already built)
skip_on: xeed.tools.terraform.cmds.terraform/check
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.build
DOCKERFILE_PATH: {xeed.tools.terraform.vars.DOCKERFILE_PATH}
IMAGE_TAG: {xeed.tools.terraform.vars.IMAGE_TAG}

# ---------------------------------------------------------------------------
# General-purpose entrypoint — ./xeed terraform <args>
# ---------------------------------------------------------------------------

[xeed.tools.terraform.cmds.terraform]
description: run terraform in the xeed terraform container — {xeed.vars.XEED_CMD} terraform <args>
depends_on: xeed.tools.terraform.cmds.terraform/build
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run_batch
IMAGE_TAG: {xeed.tools.terraform.vars.IMAGE_TAG}
# run_batch (no tty) so `$(./xeed terraform output -raw ...)` captures cleanly.
# Mount host gcloud config (ADC) and ssh keys read-only so the Google provider
# and `file(var.ssh_public_key_path)` resolve at the well-known host paths.
# Harmless/unused for non-GCP terraform. Container HOME == /home/{NAME} == host
# home path (user mirrors host), so the mount targets land where terraform looks.
EXTRA_RUN_ARGS: -e TF_IN_AUTOMATION=1 -v {xeed.vars.env.HOME}/.config/gcloud:/home/{xeed.vars.user.NAME}/.config/gcloud:ro -v {xeed.vars.env.HOME}/.ssh:/home/{xeed.vars.user.NAME}/.ssh:ro
CONTAINER_CMD: terraform {xeed.vars.cli.EXTRA_ARGS}

# ---------------------------------------------------------------------------
# Dockerfile
# ---------------------------------------------------------------------------

[xeed.tools.terraform.files.terraform]
path: {xeed.tools.terraform.vars.DOCKERFILE_PATH}
contents:
  FROM debian:bookworm-slim
  ARG DOCKER
  RUN apt-get update
  RUN apt-get install -y --no-install-recommends \
      ca-certificates \
      curl \
      unzip \
      git \
      openssh-client
  RUN rm -rf /var/lib/apt/lists/*
  RUN curl -fsSL -o /tmp/terraform.zip \
      "https://releases.hashicorp.com/terraform/{xeed.tools.terraform.vars.TERRAFORM_VERSION}/terraform_{xeed.tools.terraform.vars.TERRAFORM_VERSION}_linux_amd64.zip"
  RUN unzip /tmp/terraform.zip -d /usr/local/bin/
  RUN rm /tmp/terraform.zip
  RUN groupadd -g {xeed.vars.user.GID} {xeed.vars.user.NAME}
  RUN useradd -m -u {xeed.vars.user.UID} -g {xeed.vars.user.GID} -s /bin/bash {xeed.vars.user.NAME}
  WORKDIR /workspace
  USER {xeed.vars.user.NAME}
