[xeed.tools.multipass]

[xeed.tools.multipass.vars]
VM_NAME: {xeed.vars.PROJECT}-smoke
VM_CPUS: 2
VM_MEMORY: 4G
VM_DISK: 20G
VM_IMAGE: 22.04
SSH_KEY_PATH: {xeed.vars.env.PWD}/{xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/smoke-key
CLOUD_INIT_PATH: {xeed.vars.env.PWD}/{xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/multipass-cloud-init.yaml

[xeed.tools.multipass.cmds.multipass/write_cloud_init]
description: generate dedicated smoke keypair + write cloud-init YAML
type: xeed.types.tool.subtypes.pytool
code:
    : import os, subprocess
    : key_path = '{xeed.tools.multipass.vars.SSH_KEY_PATH}'
    : os.makedirs(os.path.dirname(key_path), exist_ok=True)
    : if not os.path.exists(key_path):
    :     subprocess.run(
    :         ['ssh-keygen', '-t', 'ed25519', '-f', key_path, '-N', '', '-C', 'darq4-smoke'],
    :         check=True
    :     )
    :     print('generated smoke keypair at ' + key_path)
    : else:
    :     print('smoke keypair already exists at ' + key_path)
    : pubkey = open(key_path + '.pub').read().strip()
    : path = '{xeed.tools.multipass.vars.CLOUD_INIT_PATH}'
    : lines = [
    :     '#cloud-config',
    :     'users:',
    :     '  - name: {xeed.vars.user.NAME}',
    :     '    uid: {xeed.vars.user.UID}',
    :     '    shell: /bin/bash',
    :     '    sudo: ALL=(ALL) NOPASSWD:ALL',
    :     '    ssh_authorized_keys:',
    :     '      - ' + pubkey,
    :     'disable_root: false',
    :     'runcmd:',
    :     '  - mkdir -p /root/.ssh',
    :     '  - echo "' + pubkey + '" >> /root/.ssh/authorized_keys',
    :     '  - chmod 700 /root/.ssh',
    :     '  - chmod 600 /root/.ssh/authorized_keys',
    : ]
    : open(path, 'w').write('\n'.join(lines) + '\n')
    : print('cloud-init written to ' + path)

[xeed.tools.multipass.cmds.multipass/launch]
description: launch a multipass VM accessible via the smoke keypair as {xeed.vars.user.NAME}
depends_on: xeed.tools.multipass.cmds.multipass/write_cloud_init
type: xeed.types.tool.subtypes.clitool
cmdstr: multipass launch \
  --name {xeed.tools.multipass.vars.VM_NAME} \
  --cpus {xeed.tools.multipass.vars.VM_CPUS} \
  --memory {xeed.tools.multipass.vars.VM_MEMORY} \
  --disk {xeed.tools.multipass.vars.VM_DISK} \
  --cloud-init {xeed.tools.multipass.vars.CLOUD_INIT_PATH} \
  {xeed.tools.multipass.vars.VM_IMAGE}

[xeed.tools.multipass.cmds.multipass/ip]
description: print the IPv4 address of the VM (for passing to remote_deploy)
type: xeed.types.tool.subtypes.clitool
cmdstr: multipass info {xeed.tools.multipass.vars.VM_NAME} --format json | \
  python3 -c "import json,sys; d=json.load(sys.stdin); print(list(d['info'].values())[0]['ipv4'][0])"

[xeed.tools.multipass.cmds.multipass/delete]
description: delete and purge the VM
type: xeed.types.tool.subtypes.clitool
cmdstr: multipass delete {xeed.tools.multipass.vars.VM_NAME} && multipass purge

[xeed.tools.multipass.cmds.multipass/shell]
description: open an SSH session on the VM as {xeed.vars.user.NAME} using the smoke keypair
type: xeed.types.tool.subtypes.clitool
cmdstr: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
  -i {xeed.tools.multipass.vars.SSH_KEY_PATH} \
  {xeed.vars.user.NAME}@$(multipass info {xeed.tools.multipass.vars.VM_NAME} --format json | \
  python3 -c "import json,sys; d=json.load(sys.stdin); print(list(d['info'].values())[0]['ipv4'][0])")
