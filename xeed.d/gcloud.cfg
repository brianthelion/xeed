[xeed.tools.gcloud]

[xeed.tools.gcloud.vars]
SDK_IMAGE: google/cloud-sdk:slim
DARQ4_APIS: compute.googleapis.com
# Public image has no baked-in USER, so force the host user (--user) to keep the
# mounted gcloud config user-owned. Redirect CLOUDSDK_CONFIG/HOME to the mount
# since /root is not writable as a non-root uid. Single line — this is spliced
# into the template cmdstr, so no backslash continuations. Passed as EXTRA_RUN_ARGS.
RUN_ARGS: --user {xeed.vars.user.UID}:{xeed.vars.user.GID} -e HOME=/gcloud -e CLOUDSDK_CONFIG=/gcloud -e USER={xeed.vars.user.NAME} -v {xeed.vars.env.HOME}/.config/gcloud:/gcloud

# ---------------------------------------------------------------------------
# SDK image (public image — pull, not build; bare docker like docker.cfg)
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/sdk/check]
type: xeed.types.tool.subtypes.clitool
cmdstr: docker image inspect {xeed.tools.gcloud.vars.SDK_IMAGE} > /dev/null 2>&1

[xeed.tools.gcloud.cmds.gcloud/sdk/pull]
description: pull the google/cloud-sdk Docker image
skip_on: xeed.tools.gcloud.cmds.gcloud/sdk/check
type: xeed.types.tool.subtypes.clitool
cmdstr: docker pull {xeed.tools.gcloud.vars.SDK_IMAGE}

# Ensure the host config dir exists BEFORE any container mounts it, so the docker
# daemon doesn't create it root-owned. clitool runs on the host as {USER}, so the
# dir is created user-owned. Idempotent — safe to run in the depends chain each time.
[xeed.tools.gcloud.cmds.gcloud/config/ensure]
depends_on: xeed.tools.gcloud.cmds.gcloud/sdk/pull
type: xeed.types.tool.subtypes.clitool
cmdstr: mkdir -p {xeed.vars.env.HOME}/.config/gcloud

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/auth/login]
description: authenticate your Google account — prints a URL, paste the code back
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud auth login --no-browser

[xeed.tools.gcloud.cmds.gcloud/auth/adc]
description: create Application Default Credentials for Terraform — prints a URL, paste the code back
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud auth application-default login --no-browser

[xeed.tools.gcloud.cmds.gcloud/auth/show]
description: show active account and ADC status
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: sh -c 'gcloud auth list; gcloud auth application-default print-access-token >/dev/null 2>&1 && echo "ADC: present" || echo "ADC: not set — run {xeed.vars.XEED_CMD} gcloud/auth/adc"'

# ---------------------------------------------------------------------------
# Project
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/project/list]
description: list all GCP projects accessible to the active account
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud projects list

[xeed.tools.gcloud.cmds.gcloud/project/show]
description: print the currently active GCP project
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud config get-value project

[xeed.tools.gcloud.cmds.gcloud/project/set]
description: set the active GCP project — {xeed.vars.XEED_CMD} gcloud/project/set PROJECT_ID
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud config set project {xeed.vars.cli.EXTRA_ARGS}

[xeed.tools.gcloud.cmds.gcloud/project/create]
description: create a new GCP project and set it active — {xeed.vars.XEED_CMD} gcloud/project/create PROJECT_ID
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: sh -c 'gcloud projects create {xeed.vars.cli.EXTRA_ARGS} && gcloud config set project {xeed.vars.cli.EXTRA_ARGS}'

# ---------------------------------------------------------------------------
# Billing
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/billing/open]
description: print the GCP billing link URL for the active project
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: sh -c 'echo https://console.cloud.google.com/billing/linkedaccount?project=$(gcloud config get-value project 2>/dev/null)'

[xeed.tools.gcloud.cmds.gcloud/billing/check]
description: check whether billing is enabled on the active project
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: sh -c 'P=$(gcloud config get-value project 2>/dev/null); S=$(gcloud beta billing projects describe "$P" --format="value(billingEnabled)" 2>/dev/null || echo unknown); echo "project: $P  billing: $S"; [ "$S" = "True" ]'

# ---------------------------------------------------------------------------
# APIs
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/api/enable]
description: enable GCP APIs required by darq4 (Compute Engine)
depends_on: xeed.tools.gcloud.cmds.gcloud/config/ensure
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.run
IMAGE_TAG: {xeed.tools.gcloud.vars.SDK_IMAGE}
EXTRA_RUN_ARGS: {xeed.tools.gcloud.vars.RUN_ARGS}
CONTAINER_CMD: gcloud services enable {xeed.tools.gcloud.vars.DARQ4_APIS}

# ---------------------------------------------------------------------------
# Guided first-time setup — orchestrates the sub-tasks above (no bare docker)
# ---------------------------------------------------------------------------

[xeed.tools.gcloud.cmds.gcloud/setup]
description: guided first-time GCP setup (auth → project → billing → APIs → ADC) — {xeed.vars.XEED_CMD} gcloud/setup PROJECT_ID
type: xeed.types.tool.subtypes.clitool
cmdstr: PROJECT="{xeed.vars.cli.EXTRA_ARGS}" && \
  [ -n "$PROJECT" ] || { echo "Usage: {xeed.vars.XEED_CMD} gcloud/setup PROJECT_ID"; exit 1; } && \
  echo "==> [1/5] Google account login (a URL will appear — open it and paste the code)" && \
  {xeed.vars.XEED_CMD} gcloud/auth/login && \
  echo "" && \
  echo "==> [2/5] project: $PROJECT" && \
  ({xeed.vars.XEED_CMD} gcloud/project/create "$PROJECT" \
    || {xeed.vars.XEED_CMD} gcloud/project/set "$PROJECT") && \
  echo "" && \
  echo "==> [3/5] billing — open this URL and link a billing account:" && \
  echo "    https://console.cloud.google.com/billing/linkedaccount?project=$PROJECT" && \
  echo "    Press Enter when billing is linked..." && \
  read _CONFIRM && \
  echo "" && \
  echo "==> [4/5] enabling APIs ({xeed.tools.gcloud.vars.DARQ4_APIS})" && \
  {xeed.vars.XEED_CMD} gcloud/api/enable && \
  echo "" && \
  echo "==> [5/5] Application Default Credentials (a URL will appear — open it and paste the code)" && \
  {xeed.vars.XEED_CMD} gcloud/auth/adc && \
  echo "" && \
  echo "==> setup complete. Run: {xeed.vars.XEED_CMD} project/deploy/whisper/gcp"
