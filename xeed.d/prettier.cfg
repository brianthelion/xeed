[xeed.tools.prettier]

[xeed.tools.prettier.vars]
IMAGE: {xeed.vars.PROJECT}-prettier:{xeed.vars.HASH}
DOCKERFILE_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/prettier.df

[xeed.tools.prettier.cmds.prettier/check]
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker image inspect {xeed.tools.prettier.vars.IMAGE} > /dev/null 2>&1

[xeed.tools.prettier.cmds.prettier/build]
description: build the prettier Docker image (node:20-slim + prettier)
skip_on: xeed.tools.prettier.cmds.prettier/check
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.build
DOCKERFILE_PATH: {xeed.tools.prettier.vars.DOCKERFILE_PATH}
IMAGE_TAG: {xeed.tools.prettier.vars.IMAGE}

[xeed.tools.prettier.cmds.prettier/wrap]
description: reflow docs/*.md prose to 90 cols in place via prettier (proseWrap=always)
depends_on: xeed.tools.prettier.cmds.prettier/build
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker run --rm \
  --user $(id -u):$(id -g) \
  -e HOME=/tmp \
  -v {xeed.vars.env.PWD}:{xeed.vars.env.PWD} \
  -w {xeed.vars.env.PWD} \
  --entrypoint prettier \
  {xeed.tools.prettier.vars.IMAGE} \
  --prose-wrap always --print-width 90 --write docs/*.md

[xeed.tools.prettier.cmds.prettier/check_docs]
description: check (do not modify) that docs/*.md are wrapped to 90 cols — non-zero exit if not
depends_on: xeed.tools.prettier.cmds.prettier/build
type: xeed.types.tool.subtypes.clitool
cmdstr: {xeed.vars.XEED_CMD} docker run --rm \
  --user $(id -u):$(id -g) \
  -e HOME=/tmp \
  -v {xeed.vars.env.PWD}:{xeed.vars.env.PWD} \
  -w {xeed.vars.env.PWD} \
  --entrypoint prettier \
  {xeed.tools.prettier.vars.IMAGE} \
  --prose-wrap always --print-width 90 --check docs/*.md

[xeed.tools.prettier.files.dockerfile]
path: {xeed.tools.prettier.vars.DOCKERFILE_PATH}
contents:
  FROM node:20-slim
  RUN npm install -g prettier@3.3.3
