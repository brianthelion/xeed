[xeed.tools.claude]
# url: https://raw.githubusercontent.com/google-claude/claude-cli/refs/heads/main/Dockerfile

[xeed.tools.claude.vars]
DOCKERFILE_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/xeed-claude.df
IMAGE_TAG: xeed-claude-cli:{xeed.vars.HASH}
LOG_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/log
KEY_DIR: {xeed.vars.env.HOME}/.claude
HIST_FILE: {xeed.vars.env.HOME}/.claude.json
SETTINGS_PATH: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/xeed-claude.json
HISTORY_SCRIPT: {xeed.vars.CACHE_DIR}/{xeed.vars.HASH}/claude_history.py

# [xeed.tools.claude.cmds.claude/fetch]
# cmdstr: wget {xeed.tools.claude.url} -O {xeed.tools.claude.vars.DOCKERFILE_PATH}

[xeed.tools.claude.files.dockerfile]
path: {xeed.tools.claude.vars.DOCKERFILE_PATH}
contents:
  FROM node:20-slim
  ARG HOST_USER={xeed.vars.user.NAME}
  ARG HOST_UID={xeed.vars.user.UID}
  ARG HOST_GID={xeed.vars.user.GID}
  RUN userdel -f node
  RUN if getent group node; then groupdel node; fi
  RUN groupadd -g "$HOST_GID" "$HOST_USER"
  RUN useradd -m -u "$HOST_UID" -g "$HOST_GID" -s /bin/bash "$HOST_USER"
  RUN apt-get update
  RUN apt-get install -y git curl vim procps
  RUN rm -rf /var/lib/apt/lists/*
  RUN npm install -g @anthropic-ai/claude-code
  ENTRYPOINT ["claude"]
  USER {xeed.vars.user.NAME}

[xeed.tools.claude.cmds.claude/keydir]
type: xeed.types.tool.subtypes.clitool
cmdstr: mkdir -p {xeed.tools.claude.vars.KEY_DIR}

[xeed.tools.claude.cmds.claude/histfile]
depends_on: xeed.tools.claude.cmds.claude/keydir
type: xeed.types.tool.subtypes.clitool
cmdstr: touch {xeed.tools.claude.vars.HIST_FILE}

[xeed.tools.claude.cmds.claude/check]
type: xeed.types.tool.subtypes.clitool
cmdstr: docker image inspect {xeed.tools.claude.vars.IMAGE_TAG} > /dev/null 2>&1

[xeed.tools.claude.cmds.claude/build]
skip_on: xeed.tools.claude.cmds.claude/check
depends_on: xeed.tools.claude.cmds.claude/histfile
type: xeed.types.tool.subtypes.templatetool
template: xeed.tools.docker.templates.build
DOCKERFILE_PATH: {xeed.tools.claude.vars.DOCKERFILE_PATH}
IMAGE_TAG: {xeed.tools.claude.vars.IMAGE_TAG}

[xeed.tools.claude.cmds.claude/cli]
description: run Claude Code in Docker
type: xeed.types.tool.subtypes.templatetool
depends_on: xeed.tools.claude.cmds.claude/build
template: xeed.tools.docker.templates.run
EXTRA_RUN_ARGS: -v {xeed.tools.claude.vars.KEY_DIR}:{xeed.tools.claude.vars.KEY_DIR} -v {xeed.tools.claude.vars.HIST_FILE}:{xeed.tools.claude.vars.HIST_FILE}
IMAGE_TAG: {xeed.tools.claude.vars.IMAGE_TAG}
CONTAINER_CMD: claude {xeed.vars.cli.EXTRA_ARGS}

[xeed.tools.claude.cmds.claude/history]
description: page through this project's Claude Code transcript (newest session; -- --list to pick)
type: xeed.types.tool.subtypes.clitool
cmdstr: python3 {xeed.tools.claude.vars.HISTORY_SCRIPT} --root {xeed.tools.claude.vars.KEY_DIR}/projects --project {xeed.vars.env.PWD} {xeed.vars.cli.EXTRA_ARGS}

# Self-contained reader materialized by xeed (no external file dependency).  The
# contents are read through configparser + xeed's own substitutor, so the Python
# is kept free of BOTH `%` (configparser interpolation) and `{`/`}` (xeed vars):
# string concatenation instead of f-strings/%-formatting, dict() not {}, a manual
# time formatter instead of strftime.  Lines use the verbatim `: ` prefix so Python
# indentation survives.  To edit: change the lines below in place, keeping it free
# of % and {} (or double them as %% / {{ }}).
[xeed.tools.claude.files.history_script]
path: {xeed.tools.claude.vars.HISTORY_SCRIPT}
contents:
    : #!/usr/bin/env python3
    : """Page through this project's Claude Code transcript(s).
    : Parses ~/.claude/projects/<slug>/*.jsonl into the real exchanges (your
    : prompts + Claude's prose; tool calls/results and continuation summaries
    : dropped) and pipes them into less with numbered, searchable headers.
    : less: SPACE/b page . />>> then n = next prompt . /<<< = next reply . q quit
    : """
    : import argparse
    : import datetime
    : import json
    : import os
    : import subprocess
    : import sys
    :
    : SKIP = (
    :     "This session is being continued",
    :     "Caveat:",
    :     "<command-",
    :     "<local-command",
    :     "<system-reminder",
    :     "<bash-",
    : )
    :
    : def slug_for(project_path):
    :     p = os.path.abspath(project_path)
    :     return p.replace("/", "-").replace(".", "-").replace("_", "-")
    :
    : def find_session_dir(root, project_path):
    :     cand = os.path.join(root, slug_for(project_path))
    :     if os.path.isdir(cand):
    :         return cand
    :     best = None
    :     best_mtime = -1.0
    :     if os.path.isdir(root):
    :         for name in os.listdir(root):
    :             d = os.path.join(root, name)
    :             if not os.path.isdir(d):
    :                 continue
    :             for f in os.listdir(d):
    :                 if f.endswith(".jsonl"):
    :                     m = os.path.getmtime(os.path.join(d, f))
    :                     if m > best_mtime:
    :                         best = d
    :                         best_mtime = m
    :     return best
    :
    : def list_sessions(session_dir):
    :     files = []
    :     for f in os.listdir(session_dir):
    :         if f.endswith(".jsonl"):
    :             files.append(os.path.join(session_dir, f))
    :     files.sort(key=os.path.getmtime)
    :     return files
    :
    : def text_from_content(content):
    :     if isinstance(content, str):
    :         return content
    :     if isinstance(content, list):
    :         parts = []
    :         for blk in content:
    :             if isinstance(blk, dict) and blk.get("type") == "text":
    :                 parts.append(blk.get("text", ""))
    :         return "\n".join(parts)
    :     return ""
    :
    : def load_turns(path):
    :     turns = []
    :     fh = open(path, encoding="utf-8")
    :     for line in fh:
    :         line = line.strip()
    :         if not line:
    :             continue
    :         try:
    :             obj = json.loads(line)
    :         except ValueError:
    :             continue
    :         typ = obj.get("type")
    :         message = obj.get("message") or dict()
    :         content = message.get("content")
    :         if typ == "user":
    :             if not isinstance(content, str):
    :                 continue
    :             text = content.strip()
    :             if not text or text.startswith(SKIP):
    :                 continue
    :             turns.append(("you", text))
    :         elif typ == "assistant":
    :             text = text_from_content(content).strip()
    :             if text:
    :                 turns.append(("claude", text))
    :     fh.close()
    :     return turns
    :
    : def count_prompts(turns):
    :     n = 0
    :     for role, t in turns:
    :         if role == "you":
    :             n += 1
    :     return n
    :
    : def fmt_time(ts):
    :     w = datetime.datetime.fromtimestamp(ts)
    :     def p2(x):
    :         return str(x).zfill(2)
    :     return str(w.year) + "-" + p2(w.month) + "-" + p2(w.day) + " " + p2(w.hour) + ":" + p2(w.minute)
    :
    : def render(turns, title):
    :     width = 76
    :     lines = []
    :     lines.append("  " + title)
    :     lines.append("  keys: SPACE/b page  />>> then n=next prompt  /<<<=next reply  q quit")
    :     lines.append("")
    :     n = 0
    :     for role, text in turns:
    :         if role == "you":
    :             n += 1
    :             lines.append(">" * width)
    :             lines.append(">>> [" + str(n) + "] YOU")
    :             lines.append(">" * width)
    :         else:
    :             lines.append("<" * width)
    :             lines.append("<<< [" + str(n) + "] CLAUDE")
    :             lines.append("<" * width)
    :         lines.append(text)
    :         lines.append("")
    :     return "\n".join(lines)
    :
    : def page(text):
    :     pager = os.environ.get("PAGER") or "less"
    :     try:
    :         proc = subprocess.Popen([pager], stdin=subprocess.PIPE)
    :         proc.communicate(text.encode("utf-8", "replace"))
    :     except FileNotFoundError:
    :         sys.stdout.write(text)
    :     except BrokenPipeError:
    :         pass
    :
    : def main():
    :     ap = argparse.ArgumentParser()
    :     ap.add_argument("--root", default=os.path.expanduser("~/.claude/projects"))
    :     ap.add_argument("--project", default=os.getcwd())
    :     ap.add_argument("--list", action="store_true")
    :     ap.add_argument("--session")
    :     args = ap.parse_args()
    :     sdir = find_session_dir(args.root, args.project)
    :     if not sdir:
    :         sys.exit("claude/history: no transcripts under " + args.root)
    :     files = list_sessions(sdir)
    :     if not files:
    :         sys.exit("claude/history: no .jsonl transcripts in " + sdir)
    :     if args.list:
    :         i = 0
    :         for f in files:
    :             i += 1
    :             turns = load_turns(f)
    :             first = ""
    :             for role, t in turns:
    :                 if role == "you":
    :                     first = t
    :                     break
    :             preview = first.replace("\n", " ")[:64]
    :             line = "[" + str(i) + "] " + fmt_time(os.path.getmtime(f)) + "  " + os.path.basename(f)[:8] + "  " + str(count_prompts(turns)).rjust(3) + " prompts  " + preview
    :             print(line)
    :         return
    :     path = files[-1]
    :     if args.session:
    :         try:
    :             path = files[int(args.session) - 1]
    :         except (ValueError, IndexError):
    :             match = None
    :             for f in files:
    :                 if args.session in os.path.basename(f):
    :                     match = f
    :                     break
    :             if not match:
    :                 sys.exit("claude/history: no session matching " + args.session)
    :             path = match
    :     turns = load_turns(path)
    :     title = os.path.basename(path)[:8] + "  -  " + str(count_prompts(turns)) + " exchanges  (newest last)"
    :     page(render(turns, title))
    :
    : if __name__ == "__main__":
    :     main()

